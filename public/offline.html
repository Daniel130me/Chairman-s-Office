<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152a"><title>Chairman's Office · Offline</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10152a;color:#f8fafc;font:16px system-ui,-apple-system,sans-serif;padding:24px}.card{max-width:440px;text-align:center;padding:36px 28px;border:1px solid #334155;border-radius:24px;background:#172033;box-shadow:0 24px 80px #0005}.mark{width:64px;height:64px;border-radius:20px;background:#24456b;display:grid;place-items:center;margin:0 auto 20px;font-size:28px}.muted{color:#a9b8ce;line-height:1.6}button{margin-top:18px;padding:12px 22px;border:0;border-radius:12px;background:#d7e6ff;color:#142238;font-weight:700;font-size:15px}
</style></head><body><main class="card"><div class="mark">♛</div><h1>Chairman's Office</h1><p class="muted">Your office is temporarily unreachable. Private business records are not stored in this offline page. Your fictional world may continue on the server. Reconnect to see the latest activity.</p><button onclick="location.reload()">Try again</button><p id="connection" class="muted" role="status">Waiting for a connection.</p></main><script>const status=document.getElementById('connection');function check(){status.textContent=navigator.onLine?'Network available. Try again to reach the office.':'No network connection.';}window.addEventListener('online',()=>{check();location.reload();});window.addEventListener('offline',check);check();</script></body></html>
