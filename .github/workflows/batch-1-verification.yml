name: Batch 1 verification
on:
  push:
    branches: [batch-1-living-world-intelligence, batch-2-corporate-empire-finance, batch-3-business-operations, batch-4-executive-experience, living-world]
  pull_request:
    branches: [living-world, batch-1-living-world-intelligence, batch-2-corporate-empire-finance, batch-3-business-operations]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: batch-1-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chairman_ci
          POSTGRES_PASSWORD: chairman_ci
          POSTGRES_DB: chairman_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chairman_ci -d chairman_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chairman_ci:chairman_ci@127.0.0.1:5432/chairman_ci?sslmode=disable
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Unit and regression tests
        run: npm test
      - name: Fresh database and idempotent migration
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs
      - name: Corporate finance database transactions
        run: RUN_CORPORATE_FINANCE_DB_TESTS=1 node --test tests/corporate-finance-db.test.mjs
      - name: Advanced operations database transactions
        run: RUN_ADVANCED_OPERATIONS_DB_TESTS=1 node --test tests/advanced-operations-db.test.mjs
      - name: Executive experience database transactions
        run: RUN_EXECUTIVE_EXPERIENCE_DB_TESTS=1 node --test tests/executive-experience-db.test.mjs
      - name: Verify production build
        run: npm run build
