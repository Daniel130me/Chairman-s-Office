services:
  - type: web
    name: chairmans-office-milestone-a
    runtime: node
    plan: free # Manual testing only; upgrade to always-on before scheduled calling.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false
      - key: TEST_DESTINATION_NUMBER
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
